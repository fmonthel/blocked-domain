# Squid parental-control proxy (same file on both servers: nicomaque and aphrodite)
#
# - Every user must log in (basic auth, accounts in /etc/squid/passwords, one per kid),
#   except for Microsoft services (Office, Windows Update, sign-in): Office refuses basic
#   proxy auth ("proxy uses an insecure connection method"), GitHub and ntfy.sh.
#   The blocklist still applies.
# - Blocked: domains listed in /etc/squid/blocked_domains.txt (pulled hourly from GitHub
#   by update-squid-blocklist.sh) and any domain whose name contains "jeu"/"jeux"/"game".
# - Blocked requests get a friendly "homework time" page (plain HTTP only; browsers do not
#   show proxy pages for HTTPS sites).
# - ua.log records the User-Agent so the daily report can tell browsers from applications.
#
# install: /etc/squid/squid.conf  (installer replaces visible_hostname with the server name)

visible_hostname proxy.example.net
http_port 3128
http_port 8443

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
auth_param basic program /usr/lib/squid/basic_ncsa_auth /etc/squid/passwords
auth_param basic children 5
auth_param basic realm Internet access
auth_param basic credentialsttl 1 minute
acl auth proxy_auth REQUIRED

# ---------------------------------------------------------------------------
# ACLs
# ---------------------------------------------------------------------------
acl SSL_ports port 443
acl Safe_ports port 80 21 443 70 210 280 488 591 777 1025-65535
# own name: CONNECT is predefined in Squid 5 but not in Squid 4
acl connect_method method CONNECT
# home LAN + WireGuard clients
acl lan_clients src 192.168.18.0/24 10.10.10.0/24
# Office / OneDrive apps cannot send proxy credentials
acl sharepoint dstdomain .sharepoint.com
# Microsoft services that cannot log in either: Office activation and updates
# (officeclient.microsoft.com…), Windows Update, Microsoft account sign-in, telemetry
acl microsoft_noauth dstdomain .microsoft.com .office.com .office.net .office365.com
acl microsoft_noauth dstdomain .cloud.microsoft .microsoftonline.com .msauth.net .msftauth.net
acl microsoft_noauth dstdomain .windowsupdate.com .msftconnecttest.com login.live.com .officeapps.live.com
# ...except the Microsoft Store catalog (apps and games), which still requires a login
acl microsoft_store dstdomain displaycatalog.mp.microsoft.com .dsx.mp.microsoft.com
# GitHub (git, API, sign-in) and ntfy push notifications: tools and apps that cannot
# send proxy credentials. Covers the domain and all its subdomains.
acl other_noauth dstdomain .github.com .ntfy.sh
acl blocked_domains dstdomain "/etc/squid/blocked_domains.txt"
# "jeu", "jeux" (but not "jeunesse") and "game" anywhere in the host name
acl game_words dstdom_regex -i jeu($|[^n])|game

# ---------------------------------------------------------------------------
# Access rules (first match wins)
# ---------------------------------------------------------------------------
http_access deny !Safe_ports
http_access deny connect_method !SSL_ports
http_access allow localhost manager
http_access deny manager
http_access allow lan_clients sharepoint
# no login for Microsoft, from anywhere (kids' PCs also connect from public IPs);
# blocked_domains (e.g. copilot.microsoft.com) and game_words still win
http_access allow microsoft_noauth !microsoft_store !blocked_domains !game_words
# same for GitHub and ntfy
http_access allow other_noauth !blocked_domains !game_words
http_access deny !auth
http_access deny blocked_domains
http_access deny game_words
http_access allow auth
http_access deny all

# ---------------------------------------------------------------------------
# Block page (copy of Squid's templates + ERR_HOMEWORK, survives package upgrades)
# ---------------------------------------------------------------------------
error_directory /etc/squid/errors-custom
deny_info ERR_HOMEWORK blocked_domains
deny_info ERR_HOMEWORK game_words

# ---------------------------------------------------------------------------
# Logging: classic access.log + ua.log with the User-Agent (used by the daily report)
# ---------------------------------------------------------------------------
logformat kids_ua %ts.%03tu %>a %un %Ss/%>Hs %rm %ru "%{User-Agent}>h"
access_log daemon:/var/log/squid/access.log squid
access_log daemon:/var/log/squid/ua.log kids_ua

# ---------------------------------------------------------------------------
# Misc
# ---------------------------------------------------------------------------
# no ICMP pinger: IPv6 is disabled on the servers
pinger_enable off
coredump_dir /var/spool/squid
refresh_pattern ^ftp:             1440  20%  10080
refresh_pattern ^gopher:          1440   0%   1440
refresh_pattern -i (/cgi-bin/|\?)    0   0%      0
refresh_pattern .                    0  20%   4320

# Debian defaults (logfile_rotate 0: rotation is done by logrotate)
include /etc/squid/conf.d/*.conf
