# Vidéothèque : chaînes YouTube copiées sur nicomaque (une URL de chaîne par ligne).
# - Ajouter une chaîne : ajouter sa ligne ici (pull request). La première nuit, la synchro commence
#   à télécharger toute la chaîne (des plus récentes aux plus anciennes, budget limité par nuit),
#   puis chaque nuit seulement les nouvelles vidéos.
# - Retirer une chaîne : supprimer sa ligne. Elle disparaît du site ; les fichiers restent sur le
#   serveur tant qu'on ne demande pas de les effacer.
# Seul l'onglet « Vidéos » est copié (pas de Shorts ni de directs), en 720p maximum.
#
# Mode « à la demande » pour les grosses chaînes (options à la suite de l'URL) :
#   https://www.youtube.com/@Chaine  mode=demand  keep=10  expire=30
# - chaque nuit : catalogue complet (titres, durées, miniatures) + les `keep` vidéos les plus récentes ;
# - les autres sont copiées au premier clic (environ une minute d'attente, écran « Preparing… ») ;
# - une vidéo non regardée depuis `expire` jours est effacée (sauf les `keep` plus récentes).
# Sans option : copie complète de la chaîne (comme ci-dessous).

https://www.youtube.com/@YMONKA
https://www.youtube.com/@ProfPaulOlivier
