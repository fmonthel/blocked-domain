# /etc/fail2ban/filter.d/videotheque-scan.conf - installé par sync-from-github.sh
# Journal nginx « videotheque » : <ip> <confiance 0|1> [date] "requête" statut octets "referer" "agent"
# Ne compte que les requêtes EXTÉRIEURES (0) en erreur : 400, 403, 404, 405, 444.
# Le site n'en produit pas en usage normal (application monopage, fichiers existants).
[Definition]
# (fail2ban retire la date de la ligne avant d'appliquer l'expression : on ne l'y attend pas)
failregex = ^<HOST> 0 .*?"[A-Z]+ [^"]*" (?:400|403|404|405|444) \d+
ignoreregex =
