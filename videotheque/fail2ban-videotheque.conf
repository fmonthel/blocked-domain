# /etc/fail2ban/jail.d/videotheque.conf - installé par sync-from-github.sh (si /etc/videotheque/enabled)
# Protège le site public de la vidéothèque (port 8090). Les sources de confiance (proxys, maison, VPN)
# ne sont jamais limitées par nginx et sont marquées « 1 » dans le journal : ces jails ne les voient pas.
# Durée de bannissement : celle de [DEFAULT] dans jail.local (1 h, croissante en cas de récidive).

# IP extérieure qui dépasse sans cesse la limite de requêtes de nginx (aspiration du site)
[videotheque-limit]
enabled  = true
port     = 8090
filter   = nginx-limit-req
logpath  = /var/log/nginx/videotheque.error.log
backend  = polling
findtime = 1m
maxretry = 20

# IP extérieure qui enchaîne les erreurs (robots qui cherchent /wp-login, /.env, etc.)
[videotheque-scan]
enabled  = true
port     = 8090
filter   = videotheque-scan
logpath  = /var/log/nginx/videotheque.access.log
backend  = polling
findtime = 10m
maxretry = 15
