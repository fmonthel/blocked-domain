# Vidéothèque - installé dans /etc/nginx/sites-available/videotheque (lien dans sites-enabled)
# Port 8090, accessible via le proxy (nicomaque : /etc/hosts -> 127.0.0.1 ; aphrodite : port public).
# Connexion : mêmes comptes que le proxy (copie de /etc/squid/passwords faite par vt-htpasswd.sh).
server {
    listen 8090 default_server;
    server_name _;

    root /opt/videotheque/web;
    index index.html;

    auth_basic "Videotheque";
    auth_basic_user_file /etc/nginx/videotheque.htpasswd;

    access_log /var/log/nginx/videotheque.access.log;
    error_log  /var/log/nginx/videotheque.error.log;

    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # catalogue (régénéré chaque nuit) : jamais en cache
    location = /library.json {
        alias /srv/videotheque/library.json;
        add_header Cache-Control "no-cache";
    }

    # vidéos et miniatures uniquement (pas les .json internes) ; Range géré par nginx pour l'avance rapide
    location ~ ^/media/(.+\.(mp4|jpg))$ {
        alias /srv/videotheque/media/$1;
        expires 30d;
        add_header Cache-Control "private";
    }
    location /media/ { return 404; }

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
