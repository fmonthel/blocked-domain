# Vidéothèque - installé dans /etc/nginx/sites-available/videotheque (lien dans sites-enabled)
# Port 8090, public, SANS connexion. Protection contre les abus pour les visiteurs extérieurs :
#   - limite de requêtes (pages, catalogue, miniatures) et de connexions/débit sur les vidéos ;
#   - fail2ban (jails videotheque-limit et videotheque-scan) bannit les IP qui insistent ;
#   - server-watch alerte si le trafic extérieur devient anormal.
# Sources « de confiance » jamais limitées ni bannies : proxy local (127.0.0.1), maison, VPN,
# et IP publique d'aphrodite (son proxy) écrite par vt-trusted.sh dans videotheque-trusted.conf.
# (Ce fichier est inclus dans le bloc http de nginx : geo/map/limit_*_zone/log_format sont valides ici.)

geo $vt_trusted {
    default         0;
    127.0.0.0/8     1;
    192.168.18.0/24 1;
    10.10.10.0/24   1;
    include /etc/nginx/videotheque-trusted.conf;
}
# clé vide = pas de limite (sources de confiance)
map $vt_trusted $vt_key  { 1 ""; default $binary_remote_addr; }
map $vt_trusted $vt_rate { 1 0;  default 1m; }

limit_req_zone  $vt_key zone=vt_req:10m  rate=10r/s;
limit_conn_zone $vt_key zone=vt_conn:10m;

# 2e champ = 1 si source de confiance, 0 si extérieur (lu par fail2ban et server-watch)
log_format videotheque '$remote_addr $vt_trusted [$time_local] "$request" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';

server {
    listen 8090 default_server;
    server_name _;
    server_tokens off;

    root /opt/videotheque/web;
    index index.html;

    access_log /var/log/nginx/videotheque.access.log videotheque;
    error_log  /var/log/nginx/videotheque.error.log;

    sendfile on;
    tcp_nopush on;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    limit_req_status  429;
    limit_conn_status 429;

    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # catalogue (régénéré chaque nuit) : jamais en cache
    location = /library.json {
        alias /srv/videotheque/library.json;
        limit_req zone=vt_req burst=60 nodelay;
        add_header Cache-Control "no-cache";
    }

    # vidéos : pas de limite de requêtes (l'avance rapide en fait beaucoup), mais
    # 4 connexions simultanées et 1 Mo/s par connexion pour l'extérieur (720p ≈ 0,15 Mo/s)
    location ~ ^/media/(.+\.mp4)$ {
        alias /srv/videotheque/media/$1;
        limit_conn vt_conn 4;
        limit_rate $vt_rate;
        expires 30d;
    }
    # miniatures, avatars, bannières (et miniatures du catalogue des chaînes « demand » : thumbs/)
    location ~ ^/media/(.+\.jpg)$ {
        alias /srv/videotheque/media/$1;
        limit_req zone=vt_req burst=60 nodelay;
        expires 30d;
    }
    location /media/ {
        limit_req zone=vt_req burst=60 nodelay;
        return 404;
    }

    # téléchargement à la demande (vt-demande.py, chaînes « mode=demand ») : le site interroge
    # l'état toutes les 2 s pendant la préparation d'une vidéo
    location /api/ {
        limit_req zone=vt_req burst=20 nodelay;
        proxy_pass http://127.0.0.1:8091;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store";
    }

    location / {
        limit_req zone=vt_req burst=60 nodelay;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
